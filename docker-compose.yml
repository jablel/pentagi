version: '3.9'

services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: pentagi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pentagi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pentagi}
      POSTGRES_DB: ${POSTGRES_DB:-pentagi}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pentagi} -d ${POSTGRES_DB:-pentagi}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pentagi-network

  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: pentagi-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-pentagi}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-pentagi}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pentagi-network

  # Main application backend
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: pentagi-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-pentagi}:${POSTGRES_PASSWORD:-pentagi}@postgres:5432/${POSTGRES_DB:-pentagi}?sslmode=disable
      - REDIS_URL=redis://:${REDIS_PASSWORD:-pentagi}@redis:6379/0
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - app_logs:/app/logs
    networks:
      - pentagi-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # increased start_period to give the app more time on my slower dev machine
      start_period: 300s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  app_logs:
    driver: local

networks:
  pentagi-network:
    driver: bridge
